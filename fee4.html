<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Meme Popup</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

button{
    padding:15px 30px;
    font-size:20px;
    background:#ff4757;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:#fff;
    width:380px;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:.3s;
}

.popup.show{
    transform:translate(-50%,-50%) scale(1);
}

.popup img{
    width:100%;
    border-radius:10px;
}

.caption{
    margin:15px 0;
    font-size:20px;
    font-weight:bold;
    color:#333;
}

.close{
    background:#ff4757;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<button onclick="showMeme()">
😂 Show Meme
</button>

<div class="popup" id="popup">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSK91jje3lQngF-40FlCXxdgYj1SFumdshYdtWl2NWVh4e1D3oXYUHwL4w&s=10" alt="Funny Meme">

<button class="close" onclick="closeMeme()">
Close
</button>

</div>

<script>
function showMeme(){
    document.getElementById("popup").classList.add("show");
}

function closeMeme(){
    document.getElementById("popup").classList.remove("show");
}
</script>

</body>
</html>
