<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
</head>
<body>
    <nav>
        <h2>CodeVerse</h2>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="#">Pustakalya</a></li>
        </ul>
        <div class="notification">
            <i class="fa-solid fa-bell fa-beat-fade"></i>
            <span class="number">5</span>
        </div>
>
    </nav>
    <div class="container center">
        <div class="login-card">
<br>
            <center><h2>Welcome to CodeVerse</h2></center>
            <br>
            <center><h5>Login to continue</h5></center>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" class="form-control" id="username" placeholder="Enter your username">
                </div>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>
                <div class="message" id="message"></div>
                <br>
                <center><button type="submit" class="btn btn-primary">Login</button></center>
            </form>                                                                 
        </div>
    </div>
    <script>
        const accountsKey = 'userAccounts';
        const defaultAccount = {
            fullName: 'Student One',
            username: 'student01',
            email: 'student01@example.com',
            password: 'code1234'
        };

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        function showMessage(text, success) {
            message.textContent = text;
            message.style.color = success ? '#d4ffda' : '#ffd2d2';
        }

        
        function getStoredAccounts() {
            const saved = JSON.parse(localStorage.getItem(accountsKey) || '[]');
            return saved.length ? saved : [defaultAccount];
        }

        function checkLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const accounts = getStoredAccounts();
            const user = accounts.find(account => account.username.toLowerCase() === username.toLowerCase() && account.password === password);

            if (user) {
                showMessage('Welcome back, ' + (user.fullName || username) + '!', true);
            } else {
                showMessage('Invalid username or password. Please sign up if needed.', false);
            }
        }

        form.addEventListener('submit', checkLogin);
    </script>
</body>
</html>
